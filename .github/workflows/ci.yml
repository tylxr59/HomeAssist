name: Release PBW
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to rebuild and publish
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Verify release tag
        run: |
          case "$RELEASE_TAG" in v*) ;; *) exit 1 ;; esac
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
      - name: Install uv and Pebble SDK
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv tool install pebble-tool
          pebble sdk install latest
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Prepare release notes
        run: npm run --silent release:notes -- "${RELEASE_TAG#v}" > release-notes.md
      - uses: actions/upload-artifact@v6
        with:
          name: homeassist-pbw
          path: build/*.pbw
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          retry() {
            local attempt=1
            local delay=5
            while ! "$@"; do
              if (( attempt >= 6 )); then return 1; fi
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
              if (( delay > 30 )); then delay=30; fi
            done
          }
          ensure_release() {
            local output
            if output="$(gh release view "$RELEASE_TAG" 2>&1)"; then return 0; fi
            if [[ "$output" == *"release not found"* ]]; then
              gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md
              return
            fi
            echo "$output" >&2
            return 1
          }
          retry ensure_release
          retry gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md
          retry gh release upload "$RELEASE_TAG" build/*.pbw --clobber
